[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otvoren-vot-admin"
version = "0.1.0"
description = "Election administration service for otvoren-vot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
