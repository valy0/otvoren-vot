name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Web (TypeScript / React) ----------
  web:
    name: Web — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run

  # ---------- Go services (each module tested independently) ----------
  go:
    name: Go — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - crypto
          - bulletin-board
          - collection
          - auth
          - tally
          - verification
          - machine
          - pkg/jwtauth
          - pkg/middleware
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.4.0
        with:
          go-version: "1.24"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  # ---------- Go build (verify all services compile) ----------
  go-build:
    name: Go — build all services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.4.0
        with:
          go-version: "1.24"
      - name: Build services
        run: |
          for dir in bulletin-board collection auth tally verification machine; do
            echo "::group::${dir}"
            cd "${dir}" && go build ./... && cd ..
            echo "::endgroup::"
          done

  # ---------- Docker build (verify Dockerfiles work) ----------
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build all service images
        run: |
          for dir in bulletin-board collection auth tally verification admin; do
            echo "::group::${dir}"
            docker build -f "${dir}/Dockerfile" -t "otvoren-vot-${dir}" .
            echo "::endgroup::"
          done

  # ---------- Python (admin API) ----------
  admin:
    name: Admin — lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
