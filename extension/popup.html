<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      margin: 0;
      color: #1d1d1f;
    }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .status { font-size: 13px; color: #6e6e73; margin-bottom: 12px; }
    .result {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 8px;
    }
    .result.match { background: #e8f5e9; color: #1b5e20; }
    .result.mismatch { background: #fce4ec; color: #b71c1c; }
    .result.pending { background: #f5f5f5; color: #666; }
    .code {
      font-family: monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 4px;
      text-align: center;
      margin: 8px 0;
    }
    .party { font-weight: 600; text-align: center; }
    .label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>
  <h1>Отворен вот</h1>
  <div class="status" id="status">Зареждане...</div>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
