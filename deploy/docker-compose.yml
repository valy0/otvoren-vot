services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bulletin_board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d bulletin_board"]
      interval: 5s
      timeout: 5s
      retries: 5

  bulletin-board:
    build:
      context: ..
      dockerfile: bulletin-board/Dockerfile
    environment:
      DATABASE_URL: postgres://board:dev@postgres:5432/bulletin_board?sslmode=disable
      LISTEN_ADDR: ":8080"
      INTERNAL_API_KEY: dev-key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
