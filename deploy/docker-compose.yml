services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bulletin_board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d bulletin_board"]
      interval: 5s
      timeout: 5s
      retries: 5

  bulletin-board:
    build:
      context: ..
      dockerfile: bulletin-board/Dockerfile
    environment:
      DATABASE_URL: postgres://board:dev@postgres:5432/bulletin_board?sslmode=disable
      LISTEN_ADDR: ":8080"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-key-change-in-production}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: auth/Dockerfile
    environment:
      LISTEN_ADDR: ":8082"
      EAUTH_MOCK: "true"  # Set to "false" for production
    ports:
      - "8082:8082"

  collection:
    build:
      context: ..
      dockerfile: collection/Dockerfile
    environment:
      LISTEN_ADDR: ":8083"
      BULLETIN_BOARD_URL: http://bulletin-board:8080
      AUTH_SERVICE_URL: http://auth:8082
      BULLETIN_BOARD_API_KEY: ${BULLETIN_BOARD_API_KEY:-dev-key-change-in-production}
      ACTIVE_SET_API_KEY: ${ACTIVE_SET_API_KEY:-dev-active-key-change-in-production}
    ports:
      - "8083:8083"
    depends_on:
      - bulletin-board
      - auth

  tally:
    build:
      context: ..
      dockerfile: tally/Dockerfile
    environment:
      LISTEN_ADDR: ":8081"
      BULLETIN_BOARD_URL: http://bulletin-board:8080
    ports:
      - "8081:8081"
    depends_on:
      - bulletin-board

  verification:
    build:
      context: ..
      dockerfile: verification/Dockerfile
    environment:
      LISTEN_ADDR: ":8084"
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:-dev-secret-change-in-production-32b}
    ports:
      - "8084:8084"

  admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    environment:
      LISTEN_ADDR: ":8085"
    ports:
      - "8085:8085"

volumes:
  pgdata:
