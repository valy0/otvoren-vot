services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bulletin_board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d bulletin_board"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
