name: otvoren-vot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bulletin_board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d bulletin_board"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - layer2
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  postgres-collection:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collection
      POSTGRES_USER: collection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata-collection:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection -d collection"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - layer1
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  bulletin-board:
    build:
      context: ..
      dockerfile: bulletin-board/Dockerfile
    environment:
      DATABASE_URL: postgres://board:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/bulletin_board?sslmode=disable
      LISTEN_ADDR: ":8080"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY required}
      SIGNING_KEY_PATH: ${SIGNING_KEY_PATH:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - layer2
      - crossover
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - layer1
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  auth:
    build:
      context: ..
      dockerfile: auth/Dockerfile
    environment:
      LISTEN_ADDR: ":8082"
      EAUTH_MOCK: "true"  # Set to "false" for production
      REDIS_URL: redis://redis:6379
      AUTH_JWT_PRIVATE_KEY: /keys/auth-private.pem
      ELECTION_ID: ${ELECTION_ID:-00000000-0000-0000-0000-000000000000}
      SESSION_API_KEY: ${SESSION_API_KEY:?SESSION_API_KEY required}
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./keys:/keys:ro
    networks:
      - layer1
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  collection:
    build:
      context: ..
      dockerfile: collection/Dockerfile
    environment:
      LISTEN_ADDR: ":8083"
      BULLETIN_BOARD_URL: http://bulletin-board:8080
      AUTH_SERVICE_URL: http://auth:8082
      BULLETIN_BOARD_API_KEY: ${BULLETIN_BOARD_API_KEY:?BULLETIN_BOARD_API_KEY required}
      ACTIVE_SET_API_KEY: ${ACTIVE_SET_API_KEY:?ACTIVE_SET_API_KEY required}
      DATABASE_URL: postgres://collection:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres-collection:5432/collection?sslmode=disable
      ELECTION_ID: ${ELECTION_ID:-00000000-0000-0000-0000-000000000000}
      EGN_HMAC_KEY: ${EGN_HMAC_KEY:?EGN_HMAC_KEY must be set}
      AUTH_JWT_PUBLIC_KEY: /keys/auth-public.pem
      SESSION_API_KEY: ${SESSION_API_KEY:?SESSION_API_KEY required}
      HISTORY_HMAC_KEY: ${HISTORY_HMAC_KEY:?HISTORY_HMAC_KEY required}
      COLLECTION_DEV_AUTH: "false"
    ports:
      - "8083:8083"
    depends_on:
      postgres-collection:
        condition: service_healthy
      bulletin-board:
        condition: service_started
      auth:
        condition: service_healthy
    volumes:
      - ./keys:/keys:ro
    networks:
      - layer1
      - crossover
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  tally:
    build:
      context: ..
      dockerfile: tally/Dockerfile
    environment:
      LISTEN_ADDR: ":8081"
      BULLETIN_BOARD_URL: http://bulletin-board:8080
      CEREMONY_API_KEY: ${CEREMONY_API_KEY:?CEREMONY_API_KEY required}
      TRUSTEE_VERIFICATION_KEYS: /keys/trustee-keys.json
      CEREMONY_STATE_DIR: /var/lib/ceremony
      ELECTION_ID: ${ELECTION_ID:-00000000-0000-0000-0000-000000000000}
    ports:
      - "8081:8081"
    volumes:
      - ./keys:/keys:ro
      - ceremony-state:/var/lib/ceremony
    depends_on:
      bulletin-board:
        condition: service_started
    networks:
      - layer2
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  verification:
    build:
      context: ..
      dockerfile: verification/Dockerfile
    environment:
      LISTEN_ADDR: ":8084"
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:?VERIFICATION_SECRET required}
    ports:
      - "8084:8084"
    networks:
      - layer2
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    environment:
      LISTEN_ADDR: ":8085"
    ports:
      - "8085:8085"
    networks:
      - layer2
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  pgdata-collection:
  redis-data:
  ceremony-state:

networks:
  layer1:
  layer2:
  crossover:
